<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc">
  <title id="title">Tissue micromechanics platform</title>
  <desc id="desc">A piezo stage drives a cantilever tip to compress a tissue spheroid in a transparent chamber of culture medium. A microbalance measures force below the chamber. A microscope images the tissue from the side.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#a31f34" stroke-width="1.4"/></marker></defs>
  <rect width="800" height="390" fill="#f6f8fa"/>
  <g font-family="Arial, sans-serif" fill="#142f43" font-size="17">
    <text x="35" y="35" font-size="12" letter-spacing="1.6" fill="#60717d">SIDE VIEW</text>
    <rect x="597" y="55" width="145" height="67" rx="3" fill="#142f43"/>
    <text x="669" y="84" text-anchor="middle" fill="#fff">Piezo stage</text>
    <text x="669" y="107" text-anchor="middle" font-size="13" fill="#d5e2eb">controls displacement</text>
    <path d="M627 122 V150 H391 V202" fill="none" stroke="#586d7d" stroke-width="8" stroke-linejoin="round"/>
    <path d="M354 205 H427" fill="none" stroke="#142f43" stroke-width="8"/>
    <path d="M430 113 V139" stroke="#a31f34" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="449" y="122" font-size="15" fill="#a31f34">Compression</text>
    <rect x="282" y="214" width="221" height="63" fill="#dbeaf3"/>
    <path d="M280 185 V280 H505 V185" fill="none" stroke="#9fb2c1" stroke-width="3"/>
    <path d="M282 214 H503" stroke="#9fb2c1" stroke-width="1.5" stroke-dasharray="6 4"/>
    <ellipse cx="391" cy="245" rx="43" ry="31" fill="#edd6dc" stroke="#a31f34" stroke-width="2"/>
    <g fill="none" stroke="#ba7382" stroke-width="1.3"><path d="M366 224 L373 240 L358 252 M373 240 L389 244 L396 225 M389 244 L382 266 M389 244 L408 254 L421 239 M408 254 L406 269"/></g>
    <rect x="279" y="294" width="227" height="58" rx="4" fill="#142f43"/>
    <text x="392" y="319" text-anchor="middle" fill="#fff">Microbalance</text>
    <text x="392" y="340" text-anchor="middle" fill="#d5e2eb" font-size="13">measures reaction force</text>
    <path d="M303 280 V294 M481 280 V294" stroke="#586d7d" stroke-width="5"/>
    <rect x="65" y="214" width="81" height="55" rx="3" fill="#586d7d"/>
    <path d="M146 224 H186 L206 233 V250 L186 259 H146 Z" fill="#9fb2c1" stroke="#586d7d" stroke-width="2"/>
    <path d="M209 241 H344" stroke="#60717d" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="44" y="296">Side-view microscope</text>
    <text x="44" y="317" font-size="13" fill="#60717d">records tissue shape</text>
    <path d="M432 201 H540" fill="none" stroke="#60717d" stroke-width="1.2"/>
    <text x="551" y="206" font-size="16">Cantilever tip</text>
    <path d="M435 245 H540" fill="none" stroke="#60717d" stroke-width="1.2"/>
    <text x="551" y="250" font-size="16">Tissue spheroid</text>
    <path d="M468 263 L528 285 H540" fill="none" stroke="#60717d" stroke-width="1.2"/>
    <text x="551" y="291" font-size="16">Culture medium</text>
    <text x="391" y="376" text-anchor="middle" font-size="13" fill="#60717d">Controlled deformation + force measurement + imaging</text>
  </g>
</svg>
